name: Build MikuPan Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018'

      - name: Configure CMake with Android NDK
        run: |
          cmake -B cmake-build-android-arm64 \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DSDL_ANDROID_HOME="$ANDROID_HOME" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_EU_VERSION=OFF

      - name: Build MikuPan APK
        run: |
          cmake --build cmake-build-android-arm64 --target MikuPan-apk -j$(nproc)

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MikuPan-Android-APK
          path: |
            cmake-build-android-arm64/*.apk
            cmake-build-android-arm64/**/*.apk
